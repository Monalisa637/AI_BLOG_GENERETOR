<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 antialiased">
    <nav class="bg-black p-4 text-while flex justify-between">
        <div>
            <h1 class="text-white text-3xl font-bold">AI BLOG GENERATOR</h1>
        </div>
        <div>
            <a href="{% url 'login' %}" class="text-white hover:underline">Login</a>
            <br>
            <a href="{% url 'signup' %}" class="text-white hover:underline">Signup</a>
        </div>
    </nav>
    <!-- Main Content -->
    <div class="flex items-center justify-center h-screen">
        <div class="bg-black p-10 shadow-md rounded-lg max-w-md w-full">
            <!-- Signup form -->
            <form class="space-y-4" method="POST" action="{% url 'signup' %}">
                {% csrf_token %}
                {% if error_message %}
                <div align='center' style='color: red'>
                    <h2>{{ error_message }}</h2>
                </div>
                {% endif %}
                <h2 class="text-xl text-white font-semibold">Signup</h2>
                <div>
                    <label for="username" class="text-white block mb-1 font-medium">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter Your Username..." class="w-full p-2 border rounded">
                </div>
                <div>
                    <label for="email" class="text-white block mb-1 font-medium">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter Your Email..." class="w-full p-2 border rounded">
                </div>
                <div>
                    <label for="password" class="text-white block mb-1 font-medium">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter Your Password..." class="w-full p-2 border rounded">
                </div>
                <div>
                    <label for="repeat_password" class="text-white block mb-1 font-medium">Repeat Password</label>
                    <input type="password" id="repeat_password" name="repeat_password" placeholder="Repeat Your Password..." class="w-full p-2 border rounded">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Signup</button>
            </form>
        </div>
    </div>
</body>
</html>
